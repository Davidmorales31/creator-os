[package]
name = "creator-os-desktop"
version = "0.0.1"
description = "Creator OS desktop shell"
authors = ["Creator OS contributors"]
edition = "2021"

[lib]
name = "creator_os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
creator-os-project-core = { path = "../../../crates/project-core" }
creator-os-media-core = { path = "../../../crates/media-core" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
