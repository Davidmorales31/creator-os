name: Native desktop build

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "packages/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "package.json"
      - "scripts/check-native-assets.py"
      - "scripts/smoke-native-startup.py"
      - "scripts/test-native-projects.py"
      - "scripts/test-native-media.py"
      - "scripts/test-native-montage.py"
      - "scripts/test-native-export.py"
      - "scripts/test-native-export-cancel.py"
      - ".github/workflows/native-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    name: Build and smoke-test Tauri 2 native (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: creator-os-native-linux
          cache-on-failure: false
      - name: Install Linux WebKit/Tauri and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ffmpeg \
            python3 \
            xvfb \
            xdotool \
            imagemagick \
            openbox \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav
      - name: Check Python E2E harness syntax before compiling native release
        run: |
          python3 -m py_compile scripts/test-native-projects.py scripts/test-native-media.py scripts/test-native-montage.py scripts/test-native-export.py scripts/test-native-export-cancel.py
      - name: Verify native icons and Tauri metadata
        run: python3 scripts/check-native-assets.py
      - name: Install frontend dependencies
        run: pnpm install
      - name: Verify offline local media tools are available
        run: |
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: Compile actual Tauri desktop executable (without installer)
        run: pnpm --dir apps/desktop exec tauri build --no-bundle
      - name: Verify desktop executable is an ELF binary
        run: |
          test -s target/release/creator-os-desktop
          test -x target/release/creator-os-desktop
          file target/release/creator-os-desktop
          file target/release/creator-os-desktop | grep -q 'ELF'
          echo "Native Tauri Linux binary built successfully."
      - name: Smoke-test actual native release window in Xvfb
        timeout-minutes: 2
        run: |
          mkdir -p native-smoke
          timeout --signal=TERM --kill-after=5s 90s \
            xvfb-run -a -s "-screen 0 1440x900x24" \
            bash -euo pipefail -c '
              openbox --sm-disable > native-smoke/window-manager.log 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true; wait $wm_pid 2>/dev/null || true" EXIT
              sleep 2
              kill -0 "$wm_pid"
              python3 scripts/smoke-native-startup.py \
                target/release/creator-os-desktop --output native-smoke --timeout 45
            '
      - name: Upload native startup logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-os-native-linux-startup
          path: native-smoke/
          if-no-files-found: warn
          retention-days: 30
      - name: Install native WebDriver test tools (CI only)
        run: |
          sudo apt-get install -y webkit2gtk-driver
          cargo install tauri-driver --version 2.0.6 --locked
          command -v tauri-driver
          command -v WebKitWebDriver
      - name: Real Tauri project persistence E2E (WebKitGTK WebDriver)
        timeout-minutes: 5
        run: |
          mkdir -p native-e2e
          timeout --signal=TERM --kill-after=5s 240s \
            xvfb-run -a -s "-screen 0 1440x900x24" \
            bash -euo pipefail -c '
              openbox --sm-disable > native-e2e/window-manager.log 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true; wait $wm_pid 2>/dev/null || true" EXIT
              sleep 2
              kill -0 "$wm_pid"
              python3 scripts/test-native-projects.py \
                target/release/creator-os-desktop --output native-e2e --timeout 55
            '
      - name: Upload native WebDriver E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-os-native-linux-webdriver-e2e
          path: native-e2e/
          if-no-files-found: warn
          retention-days: 30
      - name: Real Tauri media import and VP8/VP9 playback E2E (WebKitGTK)
        timeout-minutes: 5
        run: |
          mkdir -p native-media
          timeout --signal=TERM --kill-after=5s 240s \
            xvfb-run -a -s "-screen 0 1440x900x24" \
            bash -euo pipefail -c '
              openbox --sm-disable > native-media/window-manager.log 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true; wait $wm_pid 2>/dev/null || true" EXIT
              sleep 2
              kill -0 "$wm_pid"
              python3 scripts/test-native-media.py \
                target/release/creator-os-desktop --output native-media --timeout 55
            '
      - name: Upload real native media E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-os-native-linux-media-vp8-vp9
          path: native-media/
          if-no-files-found: warn
          retention-days: 30
      - name: Real native montage VP8 to VP9 E2E (existing Tauri WebKitGTK)
        timeout-minutes: 5
        run: |
          mkdir -p native-montage
          timeout --signal=TERM --kill-after=5s 240s \
            xvfb-run -a -s "-screen 0 1440x900x24" \
            bash -euo pipefail -c '
              openbox --sm-disable > native-montage/window-manager.log 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true; wait $wm_pid 2>/dev/null || true" EXIT
              sleep 2
              kill -0 "$wm_pid"
              python3 scripts/test-native-montage.py \
                target/release/creator-os-desktop --output native-montage
            '
      - name: Upload native montage and timeline E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-os-native-linux-timeline-montage-vp8-vp9
          path: native-montage/
          if-no-files-found: warn
          retention-days: 30
      - name: Real native Tauri H.264/AAC MP4 export E2E (WebKitGTK + FFmpeg)
        timeout-minutes: 5
        run: |
          mkdir -p native-export
          timeout --signal=TERM --kill-after=5s 240s \
            xvfb-run -a -s "-screen 0 1440x900x24" \
            bash -euo pipefail -c '
              openbox --sm-disable > native-export/window-manager.log 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true; wait $wm_pid 2>/dev/null || true" EXIT
              sleep 2
              kill -0 "$wm_pid"
              python3 scripts/test-native-export.py \
                target/release/creator-os-desktop --output native-export
            '
      - name: Upload real native MP4 export E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-os-native-linux-mp4-export-h264-aac
          path: native-export/
          if-no-files-found: warn
          retention-days: 30
      - name: Real native FFmpeg cancel, process cleanup and job recovery E2E
        timeout-minutes: 5
        run: |
          mkdir -p native-export-cancel
          timeout --signal=TERM --kill-after=5s 240s \
            xvfb-run -a -s "-screen 0 1440x900x24" \
            bash -euo pipefail -c '
              openbox --sm-disable > native-export-cancel/window-manager.log 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true; wait $wm_pid 2>/dev/null || true" EXIT
              sleep 2
              kill -0 "$wm_pid"
              python3 scripts/test-native-export-cancel.py \
                target/release/creator-os-desktop --output native-export-cancel
            '
      - name: Upload real native FFmpeg cancellation E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-os-native-linux-ffmpeg-cancel
          path: native-export-cancel/
          if-no-files-found: warn
          retention-days: 30
