name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm web:build
      - name: Verify subtitle timing boundaries
        run: node --experimental-strip-types scripts/test-captions.mjs
      - name: Verify timeline-to-source mapping
        run: node --experimental-strip-types scripts/test-timeline-preview.mjs
      - name: Verify montage sequencing contract
        run: node --experimental-strip-types scripts/test-montage-plan.mjs
      - name: Verify montage handoff lifecycle
        run: node --experimental-strip-types scripts/test-montage-handoff.mjs
      - name: Verify focused timeline keyboard shortcut contract
        run: node --experimental-strip-types scripts/test-timeline-shortcuts.mjs

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies (bounded, only when missing)
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          packages=(
            libwebkit2gtk-4.1-dev
            build-essential
            curl
            wget
            file
            libxdo-dev
            libssl-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            ffmpeg
          )
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if (("${#missing[@]}" > 0)); then
            echo "Missing Tauri packages: ${missing[*]}"
            sudo timeout --signal=TERM --kill-after=5s 150s \
              apt-get update -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo timeout --signal=TERM --kill-after=5s 180s \
              apt-get install -y --no-install-recommends \
              -o Acquire::Retries=1 "${missing[@]}"
          else
            echo "All required Tauri packages already installed."
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "ai/worker[dev]"
      - run: ruff check ai/worker
      - run: pytest ai/worker
