name: Generate Totem Cut brand icons

on:
  push:
    branches: [feat/totem-cut-brand]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install cairosvg pillow
      - run: python scripts/generate_brand_icons.py
      - name: Validate icon formats
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("apps/desktop/src-tauri/icons")
          assert Image.open(p/"icon.png").size == (512, 512)
          assert Image.open(p/"icon.ico").format == "ICO"
          assert Image.open(p/"icon.icns").format == "ICNS"
          print("Native icons OK")
          PY
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/app-icon-*.png apps/desktop/src-tauri/icons
          if ! git diff --cached --quiet; then
            git commit -m "build(brand): export Totem Cut native app icons"
            git push origin HEAD:${{ github.ref_name }}
          fi
